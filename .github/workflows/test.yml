name: .NET Framework 4.8 Regression Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore NuGet packages
      run: nuget restore IO.Swagger.sln

    - name: Build solution
      run: msbuild IO.Swagger.sln /p:Configuration=Release

    - name: Run tests with VSTest
      run: |
        & "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\Common7\IDE\Extensions\TestPlatform\vstest.console.exe" `
        src\IO.Swagger.Test\bin\Release\IO.Swagger.Test.dll

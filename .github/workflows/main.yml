name: .NET Framework 4.8 Regression Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore NuGet packages
      run: nuget restore IO.Swagger.sln

    - name: Build solution
      run: msbuild IO.Swagger.sln /p:Configuration=Release

    - name: Test
      run: dotnet test IO.Swagger.sln --configuration Release --no-build --verbosity normal
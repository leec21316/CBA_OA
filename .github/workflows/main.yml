name: .NET Framework 4.8 Regression Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-      

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore NuGet packages
      run: nuget restore IO.Swagger.sln

    - name: Build solution
      run: msbuild IO.Swagger.sln /p:Configuration=Release

    - name: Find and run VSTest
      shell: pwsh
      run: |
        $vsTestPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find **\vstest.console.exe | Select-Object -First 1

        Write-Host "Using VSTest at $vsTestPath"

        & "$vsTestPath" "src\IO.Swagger.Test\bin\Release\IO.Swagger.Test.dll" --logger:trx
        
    - name: Upload test results
      if: always()  # ensure this runs even if tests fail
      uses: actions/upload-artifact@v3
      with:
        name: TestResults
        path: |
          src/IO.Swagger.Test/TestResults/*.trx

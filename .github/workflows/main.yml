name: .NET Framework 4.8 Regression Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore NuGet packages
      run: nuget restore IO.Swagger.sln

    - name: Build solution
      run: msbuild IO.Swagger.sln /p:Configuration=Release

    - name: Start API Server
      run: docker run -d -p 8080:8080 swaggerapi/petstore

    - name: Wait for API to be ready
      run: |
        echo "Waiting for Petstore API to start..."
        for i in {1..10}; do
          if curl --silent http://localhost:8080/api/v3/swagger.json > /dev/null; then
            echo "API is up!"
            break
          fi
          sleep 5
        done

    - name: Find and run VSTest
      shell: pwsh
      run: |
        $vsTestPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find **\vstest.console.exe | Select-Object -First 1

        Write-Host "Using VSTest at $vsTestPath"

        & "$vsTestPath" "src\IO.Swagger.Test\bin\Release\IO.Swagger.Test.dll" --logger:trx

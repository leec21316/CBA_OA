name: .NET Framework 4.8 Regression Tests

on:
  push:
    branches: [ feature/Dongsheng-CBATest ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore NuGet packages
      run: nuget restore IO.Swagger.sln

    - name: Build solution
      run: msbuild IO.Swagger.sln /p:Configuration=Release

    - name: Locate VSTest
      id: locate-vstest
      shell: pwsh
      run: |
        $vsTestPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find **\vstest.console.exe
        echo "Found vstest at $vsTestPath"
        echo "VSTEST_PATH=$vsTestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


    - name: Run tests with VSTest
      shell: pwsh
      run: |
        & "$env:VSTEST_PATH" "src\IO.Swagger.Test\bin\Release\IO.Swagger.Test.dll" --logger:trx
